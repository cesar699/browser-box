# 可选：用 VPS 上已有的 nginx 给云浏览器套 HTTPS（推荐长期使用时配）
# 1) 把子域名（如 browser.example.com）的 A 记录解析到本机
# 2) 用 acme.sh 等工具给该子域名签好证书，把下面证书路径换成实际路径
# 3) 本文件放入 /etc/nginx/sites-available/ 并软链到 sites-enabled，nginx -t && systemctl reload nginx
# 4) 把 .env 里 WEB_BIND 改为 127.0.0.1 后重跑 deploy.sh（界面只经 nginx 暴露）
server {
    listen 443 ssl;
    http2 on;
    server_name browser.example.com;

    ssl_certificate     /root/.acme.sh/browser.example.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/browser.example.com_ecc/browser.example.com.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Neko 用 WebSocket 传控制信令，必须透传 Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
# 注意：WebRTC 的 UDP 52000-52100 不走 nginx，仍需在安全组/防火墙直接放行。
