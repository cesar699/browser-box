<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>browser-box</title>
<style>
:root { color-scheme: dark;}
* { box-sizing: border-box;}
html, body { margin: 0; height: 100%; background: #0b0e13; color: #e6ebf2;
font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;}
button { background: #1c2330; color: #e6ebf2; border: 1px solid #2c3648; border-radius: 8px;
padding: 7px 10px; font-size: 14px; cursor: pointer; white-space: nowrap;}
button:active { background: #273146;}
button.flash { background: #2b4acb; border-color: #7ea0ff;}
select { background: #1c2330; color: #e6ebf2; border: 1px solid #2c3648; border-radius: 8px;
padding: 7px 4px; font-size: 13px;}
input { background: #121722; color: #e6ebf2; border: 1px solid #2c3648; border-radius: 8px;
padding: 8px 10px; font-size: 15px; outline: none;}
input:focus { border-color: #3d5a99;}

#login { position: fixed; inset: 0; display: none; place-items: center; background: #0b0e13; z-index: 50;}
#login.card { width: min(92vw, 340px); background: #131926; border: 1px solid #26314a;
border-radius: 14px; padding: 26px 22px; text-align: center;}
#login h1 { font-size: 20px; margin: 0 0 4px;}
#login p { color: #93a1b5; font-size: 13px; margin: 0 0 18px;}
#login input { width: 100%; margin-bottom: 12px; text-align: center;}
#login button { width: 100%; background: #2b4acb; border-color: #2b4acb;}
#login.err { color: #ff7a7a; font-size: 13px; min-height: 18px; margin-top: 10px;}

#app { display: none; flex-direction: column; height: 100%;}
#bar { display: flex; gap: 6px; align-items: center; padding: 6px; background: #11161f;
border-bottom: 1px solid #232c3d; flex-wrap: wrap;}
#url { flex: 1; min-width: 110px;}
#fps { color: #7d8ea6; font-size: 12px; min-width: 52px; text-align: center;}
#tabstrip { display: flex; gap: 4px; align-items: center; padding: 4px 6px; background: #0d1119;
border-bottom: 1px solid #1d2536; overflow-x: auto; scrollbar-width: none;}
#tabstrip::-webkit-scrollbar { display: none;}
.tab { display: flex; align-items: center; gap: 6px; max-width: 200px; padding: 5px 8px;
background: #161d2a; border: 1px solid #232c3d; border-radius: 8px 8px 0 0; cursor: pointer;
font-size: 13px; color: #aebdd2; white-space: nowrap;}
.tab.active { background: #1f2a3f; color: #fff; border-color: #3d5a99;}
.tab.t { overflow: hidden; text-overflow: ellipsis; max-width: 150px;}
.tab.x { color: #8494ab; padding: 0 2px;}
.tab.x:active { color: #ff7a7a;}
#stage { position: relative; flex: 1; overflow: hidden; background: #000;
display: grid; place-items: center;}
#screen { max-width: 100%; max-height: 100%; touch-action: none; user-select: none; -webkit-user-select: none;}
#overlay { position: absolute; inset: 0; display: none; place-items: center;
background: rgba(0,0,0,.55); color: #cfd9e6; font-size: 15px; pointer-events: none;}
#toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
background: rgba(20,28,42,.95); border: 1px solid #3d5a99; color: #e6ebf2; padding: 9px 14px;
border-radius: 10px; font-size: 14px; display: none; max-width: 92%; text-align: center; z-index: 5;}
#pasteBox, #filesPanel { display: none; padding: 8px; background: #11161f; border-top: 1px solid #232c3d; gap: 6px;}
#pasteBox textarea { flex: 1; background: #121722; color: #e6ebf2; border: 1px solid #2c3648;
border-radius: 8px; padding: 8px; font-size: 15px; height: 38px; resize: none;}
#filesPanel { flex-direction: column; max-height: 40%; overflow-y: auto;}
#filesPanel.f { display: flex; justify-content: space-between; align-items: center;
padding: 7px 4px; border-bottom: 1px solid #1d2536; font-size: 14px;}
#filesPanel a { color: #8db4ff; text-decoration: none;}
#kbd { position: fixed; left: 8px; bottom: 8px; width: 40px; height: 30px; opacity: 0.01; z-index: -1;}
</style>
</head>
<body>

<div id="login">
<div class="card">
<h1>🌐 browser-box</h1>
<p>浏览器跑在你的服务器上<br>输入密码进入</p>
<form id="loginForm">
<input id="pw" type="password" placeholder="密码" autocomplete="current-password" autofocus>
<button type="submit">进入</button>
<div class="err" id="loginErr"></div>
</form>
</div>
</div>

<div id="app">
<div id="bar">
<button id="back" title="后退">←</button>
<button id="fwd" title="前进">→</button>
<button id="reload" title="刷新">⟳</button>
<button id="home" title="起始页">⌂</button>
<input id="url" placeholder="输入网址，回车打开" inputmode="url">
<select id="quality" title="流畅度 / 画质">
<option value="smooth">流畅优先</option>
<option value="clear" selected>清晰</option>
<option value="hd">高清</option>
</select>
<select id="zoom" title="缩放">
<option value="1" selected>100%</option>
<option value="1.25">125%</option>
<option value="1.5">150%</option>
<option value="2">200%</option>
</select>
<span id="fps"></span>
<button id="audioBtn" title="声音开关（远程浏览器的声音）">🔇</button>
<button id="kbdBtn" title="唤起键盘（含中文输入法）">⌨</button>
<button id="pasteBtn" title="粘贴文字到远程浏览器">粘贴</button>
<button id="clipBtn" title="把远程浏览器里复制的文字取回本地">取剪贴板</button>
<button id="uploadBtn" title="上传文件到远程浏览器">上传</button>
<button id="filesBtn" title="远程下载的文件">下载</button>
<button id="logout" title="退出登录">⏻</button>
</div>
<div id="tabstrip"></div>
<div id="stage">
<canvas id="screen" width="1280" height="720" tabindex="0"></canvas>
<div id="overlay">连接中…</div>
<div id="toast"></div>
</div>
<div id="pasteBox">
<textarea id="pasteText" placeholder="把文字粘到这里，发送后会输入到远程浏览器当前焦点"></textarea>
<button id="pasteSend">发送</button>
<button id="pasteClose">关闭</button>
</div>
<div id="filesPanel"></div>
<input id="kbd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
<input id="filePick" type="file" style="display:none">
</div>

<script>
const $ = s => document.querySelector(s);
const loginEl = $('#login'), appEl = $('#app'), canvas = $('#screen'), ctx = canvas.getContext('2d');
const overlay = $('#overlay'), urlInput = $('#url'), toastEl = $('#toast');
let ws = null, frameW = 1280, frameH = 720, urlEditing = false;
let framesThisSecond = 0;

function toast(msg, ms = 3200) {
toastEl.textContent = msg; toastEl.style.display = 'block';
clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.style.display = 'none', ms);
}

async function me() {
try { const r = await fetch('/api/me'); return (await r.json()).authed;} catch { return false;}
}
async function boot() {
if (await me()) { showApp();} else { loginEl.style.display = 'grid';}
}

$('#loginForm').addEventListener('submit', async e => {
e.preventDefault();
$('#loginErr').textContent = '';
const r = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'},
body: JSON.stringify({ password: $('#pw').value})});
if (r.ok) { loginEl.style.display = 'none'; showApp();}
else if (r.status === 429) { $('#loginErr').textContent = '试错太多次，锁定几分钟';}
else { $('#loginErr').textContent = '密码不对';}
});
$('#logout').addEventListener('click', async () => {
await fetch('/api/logout', { method: 'POST'}); location.reload();
});

function showApp() { appEl.style.display = 'flex'; connect(); sendResizeSoon();}
function setOverlay(t) {
if (t) { overlay.textContent = t; overlay.style.display = 'grid';}
else overlay.style.display = 'none';
}

function connect() {
ws = new WebSocket((location.protocol === 'https:'? 'wss://': 'ws://') + location.host + '/ws');
ws.binaryType = 'blob';
ws.onopen = () => { setOverlay(''); sendResize();};
ws.onclose = () => { setOverlay('连接断开，重连中…'); setTimeout(connect, 2500);};
ws.onerror = () => { try { ws.close();} catch {}};
ws.onmessage = async ev => {
if (typeof ev.data === 'string') {
try { handleControl(JSON.parse(ev.data)); } catch {}
return;
}
const first = await peek(ev.data);
if (first === '{') {
try { handleControl(JSON.parse(await ev.data.text())); } catch {}
return;
}
if (first.charCodeAt(0) === 0xA1) { onAudioChunk(ev.data.slice(1)); return; }
framesThisSecond++;
if (decoding) { pendingFrame = ev.data; return; }
decoding = true;
let blob = ev.data;
while (blob) {
try {
const bmp = await createImageBitmap(blob);
if (bmp.width !== frameW || bmp.height !== frameH) {
frameW = bmp.width; frameH = bmp.height; canvas.width = frameW; canvas.height = frameH;
}
ctx.drawImage(bmp, 0, 0); bmp.close();
} catch {}
blob = pendingFrame; pendingFrame = null;
}
decoding = false;
};
}
let decoding = false, pendingFrame = null;
async function peek(blob) { return await blob.slice(0, 1).text(); }

setInterval(() => { $('#fps').textContent = framesThisSecond? framesThisSecond + ' fps': ''; framesThisSecond = 0;}, 1000);

function handleControl(m) {
switch (m.type) {
case 'status':
setOverlay(m.status === 'ready'? '': '浏览器' + m.status + '…');
break;
case 'tabs':
renderTabs(m.tabs || []);
if (!urlEditing && document.activeElement!== urlInput && m.url) urlInput.value = m.url;
if (m.title) document.title = m.title + ' · browser-box';
break;
case 'download':
if (m.state === 'begin') toast('开始下载：' + m.name);
if (m.state === 'completed') { toast('下载完成：' + m.name + '（点保存到本地）', 5000); refreshFiles();}
if (m.state === 'canceled') toast('下载取消：' + m.name);
break;
case 'chooser':
$('#uploadBtn').classList.add('flash');
toast('页面在选文件：点挑好文件，会自动填进去', 6000);
break;
case 'chooser_done':
$('#uploadBtn').classList.remove('flash');
toast('文件已填入页面 ✔');
break;
case 'clipboard':
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(m.text).then(() => toast('已取回本地剪贴板 ✔'), () => fallbackClip(m.text));
} else fallbackClip(m.text);
break;
case 'error':
setOverlay(m.message);
break;
}
}
function fallbackClip(t) {
const b = $('#pasteBox'); b.style.display = 'flex'; $('#pasteText').value = t;
toast('远程剪贴板内容已放进粘贴框，自行复制');
}

function renderTabs(tabs) {
const strip = $('#tabstrip');
strip.innerHTML = '';
for (const t of tabs) {
const d = document.createElement('div');
d.className = 'tab' + (t.active? ' active': '');
const label = document.createElement('span'); label.className = 't'; label.textContent = t.title || t.url || '新标签';
label.title = t.url || '';
label.onclick = () => send({ type: 'tab_switch', tabId: t.id});
const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕';
x.onclick = ev => { ev.stopPropagation(); send({ type: 'tab_close', tabId: t.id});};
d.appendChild(label); d.appendChild(x);
strip.appendChild(d);
}
const plus = document.createElement('button');
plus.textContent = '＋'; plus.title = '新标签';
plus.onclick = () => send({ type: 'tab_new'});
strip.appendChild(plus);
}

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));}

/* ---------- navigation & tools ---------- */
function navigate() {
let u = urlInput.value.trim();
if (!u) return;
if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u) &&!/^about:/.test(u)) {
u = (u.includes('.') &&!u.includes(' '))? 'https://' + u
: 'https://duckduckgo.com/?q=' + encodeURIComponent(u);
}
send({ type: 'navigate', url: u}); urlInput.blur();
}
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') navigate(); e.stopPropagation();});
urlInput.addEventListener('keyup', e => e.stopPropagation());
urlInput.addEventListener('focus', () => urlEditing = true);
urlInput.addEventListener('blur', () => urlEditing = false);
$('#back').onclick = () => send({ type: 'back'});
$('#fwd').onclick = () => send({ type: 'forward'});
$('#reload').onclick = () => send({ type: 'reload'});
$('#home').onclick = () => send({ type: 'home'});
const PERF = {
smooth: { quality: 40, fps: 15, scale: 0.7 },
clear: { quality: 60, fps: 24, scale: 1 },
hd: { quality: 80, fps: 30, scale: 1 },
};
$('#quality').onchange = e => send({ type: 'perf', ...PERF[e.target.value] });
$('#zoom').onchange = e => send({ type: 'zoom', dsf: parseFloat(e.target.value)});
$('#clipBtn').onclick = () => { send({ type: 'clipread'}); toast('正在读取远程剪贴板…');};

$('#pasteBtn').onclick = () => { const b = $('#pasteBox'); b.style.display = b.style.display === 'flex'? 'none': 'flex';};
$('#pasteClose').onclick = () => $('#pasteBox').style.display = 'none';
$('#pasteSend').onclick = () => {
const t = $('#pasteText').value;
if (t) send({ type: 'text', text: t});
$('#pasteText').value = ''; $('#pasteBox').style.display = 'none'; canvas.focus();
};

/* ---------- audio (fMP4/AAC over the same socket, 0xA1-prefixed) ---------- */
let audioOn = false, msA = null, sbA = null, aEl = null, aQueue = [];
function pumpA() {
  if (sbA && !sbA.updating && aQueue.length) {
    try { sbA.appendBuffer(aQueue.shift()); } catch { aQueue = []; }
  }
}
function onAudioChunk(blob) {
  if (!audioOn) return;
  blob.arrayBuffer().then(buf => {
    aQueue.push(buf);
    if (aQueue.length > 40) aQueue.splice(0, aQueue.length - 40);
    pumpA();
  });
}
$('#audioBtn').onclick = () => {
  const btn = $('#audioBtn');
  if (!audioOn) {
    if (!('MediaSource' in window)) { toast('此浏览器不支持音频流'); return; }
    try {
      aQueue = []; sbA = null;
      msA = new MediaSource();
      aEl = new Audio();
      aEl.src = URL.createObjectURL(msA);
      msA.addEventListener('sourceopen', () => {
        try {
          sbA = msA.addSourceBuffer('audio/mp4; codecs="mp4a.40.2"');
          sbA.addEventListener('updateend', pumpA);
        } catch { toast('此浏览器不支持 AAC 音频流'); }
      });
      aEl.play().catch(() => {});
      send({ type: 'audio', on: true });
      audioOn = true; btn.textContent = '🔊'; btn.classList.add('flash');
    } catch { toast('音频启动失败'); }
  } else {
    send({ type: 'audio', on: false });
    audioOn = false; btn.textContent = '🔇'; btn.classList.remove('flash');
    if (aEl) { aEl.pause(); aEl = null; }
    aQueue = [];
  }
};

/* ---------- downloads panel ---------- */
async function refreshFiles() {
const panel = $('#filesPanel');
try {
const r = await fetch('/api/files');
const files = await r.json();
panel.innerHTML = files.length? '': '<div class="f">还没有下载的文件</div>';
for (const f of files || []) {
const row = document.createElement('div'); row.className = 'f';
const nm = document.createElement('span'); nm.textContent = f.name + '（' + fmtSize(f.size) + '）';
const a = document.createElement('a');
a.href = '/api/download?name=' + encodeURIComponent(f.name); a.textContent = '保存到本地'; a.download = f.name;
row.appendChild(nm); row.appendChild(a); panel.appendChild(row);
}
} catch {}
}
function fmtSize(n) { return n > 1048576? (n / 1048576).toFixed(1) + ' MB': Math.max(1, Math.round(n / 1024)) + ' KB';}
$('#filesBtn').onclick = () => {
const p = $('#filesPanel');
const show = p.style.display!== 'flex';
p.style.display = show? 'flex': 'none';
if (show) refreshFiles();
};

/* ---------- upload ---------- */
$('#uploadBtn').onclick = () => $('#filePick').click();
$('#filePick').addEventListener('change', async e => {
const f = e.target.files[0]; e.target.value = '';
if (!f) return;
const fd = new FormData(); fd.append('file', f);
toast('上传中：' + f.name);
const r = await fetch('/api/upload', { method: 'POST', body: fd});
if (r.ok) { $('#uploadBtn').classList.remove('flash'); toast('已上传：' + f.name + '（若页面正等选文件，已自动填入；否则点页面上的选文件按钮）', 5000);}
else toast('上传失败');
});

/* ---------- mouse / touch ---------- */
function frac(e) {
const r = canvas.getBoundingClientRect();
return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))};
}
const btnName = b => b === 1? 'middle': b === 2? 'right': 'left';
let lastMove = 0, pressTimer = null, pressPos = null;
canvas.addEventListener('pointerdown', e => {
canvas.setPointerCapture(e.pointerId); canvas.focus();
const p = frac(e); pressPos = p;
send({ type: 'mousedown',...p, button: btnName(e.button), buttons: e.buttons, clickCount: e.detail || 1});
if (e.pointerType === 'touch') {
pressTimer = setTimeout(() => { // long press = right click
send({ type: 'mouseup',...p, button: 'left', buttons: 0, clickCount: 1});
send({ type: 'mousedown',...p, button: 'right', buttons: 2, clickCount: 1});
send({ type: 'mouseup',...p, button: 'right', buttons: 0, clickCount: 1});
if (navigator.vibrate) navigator.vibrate(30);
pressPos = null;
}, 550);
}
e.preventDefault();
});
canvas.addEventListener('pointerup', e => {
clearTimeout(pressTimer);
if (pressPos) {
const p = frac(e);
send({ type: 'mouseup',...p, button: btnName(e.button), buttons: e.buttons, clickCount: e.detail || 1});
}
pressPos = null;
e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
if (pressPos && e.pointerType === 'touch') {
const p = frac(e);
if (Math.abs(p.x - pressPos.x) > 0.02 || Math.abs(p.y - pressPos.y) > 0.02) clearTimeout(pressTimer);
}
const now = performance.now(); if (now - lastMove < 16) return; lastMove = now;
const p = frac(e);
send({ type: 'mousemove',...p, button: 'none', buttons: e.buttons});
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
let wheelAcc = { x: 0, y: 0}, wheelTimer = null;
canvas.addEventListener('wheel', e => {
e.preventDefault();
wheelAcc.x += e.deltaX; wheelAcc.y += e.deltaY;
const p = frac(e), mod = mods(e);
if (!wheelTimer) wheelTimer = setTimeout(() => {
send({ type: 'wheel',...p, deltaX: wheelAcc.x, deltaY: wheelAcc.y, modifiers: mod});
wheelAcc = { x: 0, y: 0}; wheelTimer = null;
}, 40);
}, { passive: false});

/* ---------- keyboard ---------- */
function mods(e) { return (e.altKey? 1: 0) | (e.ctrlKey? 2: 0) | (e.metaKey? 4: 0) | (e.shiftKey? 8: 0);}
function inLogin() { return loginEl.style.display === 'grid';}
const SPECIAL = ['Backspace','Enter','Tab','Escape','Delete','Home','End','PageUp','PageDown',
'ArrowLeft','ArrowRight','ArrowUp','ArrowDown','CapsLock','Shift','Control','Alt','Meta','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'];

document.addEventListener('keydown', e => {
const t = e.target;
if (inLogin() || t === urlInput || t.tagName === 'TEXTAREA' || t === $('#kbd')) return;
if (e.isComposing) return;
const printable = e.key.length === 1 &&!e.ctrlKey &&!e.metaKey &&!e.altKey;
send({ type: 'keydown', key: e.key, code: e.code, vk: e.keyCode, modifiers: mods(e),
text: printable? e.key: ''});
e.preventDefault();
});
document.addEventListener('keyup', e => {
const t = e.target;
if (inLogin() || t === urlInput || t.tagName === 'TEXTAREA' || t === $('#kbd')) return;
if (e.isComposing) return;
send({ type: 'keyup', key: e.key, code: e.code, vk: e.keyCode, modifiers: mods(e)});
e.preventDefault();
});

/* Mobile / IME keyboard: a hidden input captures real text input (incl.
Chinese composition) and forwards it to the remote page. */
const kbd = $('#kbd');
let composing = false;
$('#kbdBtn').onclick = () => { kbd.style.zIndex = 10; kbd.focus(); toast('键盘已唤起，打字会送到远程页面');};
kbd.addEventListener('blur', () => { kbd.style.zIndex = -1; kbd.value = '';});
kbd.addEventListener('compositionstart', () => composing = true);
kbd.addEventListener('compositionend', e => {
composing = false;
if (e.data) send({ type: 'text', text: e.data});
kbd.value = '';
});
kbd.addEventListener('beforeinput', e => {
if (composing) return;
if (e.inputType === 'insertText' && e.data) { send({ type: 'text', text: e.data}); e.preventDefault(); kbd.value = '';}
if (e.inputType === 'insertFromPaste' && e.data) { send({ type: 'text', text: e.data}); e.preventDefault();}
if (e.inputType === 'deleteContentBackward') {
send({ type: 'keydown', key: 'Backspace', code: 'Backspace', vk: 8, modifiers: 0});
e.preventDefault();
}
});
kbd.addEventListener('keydown', e => {
if (composing) return;
if (SPECIAL.includes(e.key)) {
send({ type: 'keydown', key: e.key, code: e.code, vk: e.keyCode, modifiers: mods(e), text: ''});
e.preventDefault();
}
});
kbd.addEventListener('keyup', e => {
if (SPECIAL.includes(e.key)) {
send({ type: 'keyup', key: e.key, code: e.code, vk: e.keyCode, modifiers: mods(e)});
e.preventDefault();
}
});

/* ---------- resize ---------- */
let resizeTimer = null;
function sendResize() {
const st = document.querySelector('#stage');
const w = Math.round(Math.min(1920, Math.max(320, st.clientWidth)));
const h = Math.round(Math.min(1080, Math.max(240, st.clientHeight)));
send({ type: 'resize', width: w, height: h});
}
function sendResizeSoon() { clearTimeout(resizeTimer); resizeTimer = setTimeout(sendResize, 350);}
window.addEventListener('resize', sendResizeSoon);

boot();
</script>
</body>
</html>
